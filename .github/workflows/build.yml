name: Build WCUltra deb

# 自动在 macOS runner 上用 Theos 编译 MomentsTagFilter/ 子项目，同时产出 rootless 与 rootful 两种 .deb。
# 触发：push，或 Actions 页 "Run workflow"。产物在运行页 Artifacts: "MomentsTagFilter-deb"。
# push 到 main 时，两个 deb 会自动发布到 GitHub Release（tag = v<control 里的 Version>）；
# Release 说明的「更新日志」优先取 CHANGELOG.md 中该版本的小节，没有小节时用上一个 tag 以来的提交记录生成。

on:
  push:
  workflow_dispatch:
    inputs:
      tg_test:
        description: '手动运行时向 TG 群发送一条测试转发（带测试标记）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: MomentsTagFilter
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Theos + iOS SDK
        run: |
          brew install ldid dpkg make xz || true
          export THEOS=$HOME/theos
          git clone --quiet --recursive https://github.com/theos/theos.git "$THEOS"
          curl -fsSL "https://github.com/theos/sdks/archive/refs/heads/master.zip" -o /tmp/sdks.zip
          mkdir -p /tmp/sdks && unzip -q /tmp/sdks.zip -d /tmp/sdks
          # 取一个可用的 iPhoneOS SDK（优先 16.5，否则任意一个）
          SRC=$(ls -d /tmp/sdks/sdks-master/iPhoneOS16.5.sdk 2>/dev/null || ls -d /tmp/sdks/sdks-master/iPhoneOS*.sdk | head -1)
          cp -R "$SRC" "$THEOS/sdks/"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "Using SDK: $SRC"

      - name: Read version
        run: |
          VERSION=$(grep -E '^Version:' control | awk '{print $2}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      - name: Build rootless deb
        run: |
          make clean || true
          rm -f packages/*.deb
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp packages/*.deb "$GITHUB_WORKSPACE/dist/wcultra_${VERSION}_rootless.deb"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Build rootful deb
        run: |
          make clean || true
          rm -f packages/*.deb
          make package FINALPACKAGE=1
          cp packages/*.deb "$GITHUB_WORKSPACE/dist/wcultra_${VERSION}_rootful.deb"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WCUltra-deb
          path: dist/*.deb

      - name: Publish GitHub Release
        id: publish
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "## WCUltra ${TAG}"
            echo
            echo "## 📝 更新日志"
            echo
            if [ -f CHANGELOG.md ] && grep -qE "^## .*${VERSION}" CHANGELOG.md; then
              awk -v ver="$VERSION" '
                $0 ~ "^## " { if (found) exit; if (index($0, ver)) found=1 }
                found { print }
              ' CHANGELOG.md | tail -n +2
            else
              LASTTAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
              if [ -n "$LASTTAG" ]; then RANGE="$LASTTAG..HEAD"; else RANGE="HEAD"; fi
              git log $RANGE --no-merges --pretty=format:'- %s' | grep -vE '^- (ci:|ci：|流水线)' || true
              echo
            fi
            echo "## 📦 安装包"
            echo
            echo "- \`wcultra_${VERSION}_rootless.deb\`：rootless 越狱（Dopamine、palera1n rootless 等，安装路径 /var/jb）"
            echo "- \`wcultra_${VERSION}_rootful.deb\`：rootful 越狱（checkra1n、unc0ver 等，安装路径 /）"
            echo
            echo "_构建时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')（北京时间） · 提交：${GITHUB_SHA:0:7}_"
          } > "$NOTES"
          cat "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb --clobber
            gh release edit "$TAG" --title "MomentsTagFilter $TAG" --notes-file "$NOTES"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$TAG" dist/*.deb --title "MomentsTagFilter $TAG" --notes-file "$NOTES"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      # 主动推送到 Telegram 群（替代原先的本机定时轮询中继）：
      # 仅在本次新建了 Release 时发送，避免重复推送；手动运行可勾 tg_test 发一条带标记的测试。
      - name: Notify Telegram
        if: github.ref == 'refs/heads/main' && (steps.publish.outputs.created == 'true' || inputs.tg_test)
        working-directory: ${{ github.workspace }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_TEST: ${{ inputs.tg_test }}
        run: |
          python3 - <<'PY'
          import glob, html, json, os, re, sys, urllib.parse, urllib.request, uuid
          token = os.environ['TG_BOT_TOKEN']; chat = os.environ['TG_CHAT_ID']; ver = os.environ['VERSION']
          notes = open(os.path.join(os.environ['RUNNER_TEMP'], 'notes.md'), encoding='utf-8').read()
          m = re.search(r'## 📝 更新日志\s*(.*?)\s*## 📦', notes, re.S)
          raw = m.group(1).strip() if m else ''
          out = []
          for ln in raw.splitlines():
              s = ln.rstrip()
              if s.startswith('- '): s = '• ' + s[2:]
              elif s.startswith('## '): s = s[3:]
              s = html.escape(s, quote=False)
              s = re.sub(r'\*\*(.+?)\*\*', r'<b>\1</b>', s)
              s = re.sub(r'`([^`]+)`', r'<code>\1</code>', s)
              out.append(s)
          title = f"<b>📦 WCUltra v{ver} 发布</b>"
          if os.environ.get('TG_TEST') == 'true': title += '（流水线转发测试）'
          text = (title + '\n\n' + '\n'.join(out).strip())[:2600]

          def post(path, fields, files=None):
              url = f'https://api.telegram.org/bot{token}/{path}'
              if files:
                  b = '----mtf' + uuid.uuid4().hex
                  body = b''
                  for k, v in fields.items():
                      body += (f'--{b}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n').encode()
                  for k, (fn, content) in files.items():
                      body += (f'--{b}\r\nContent-Disposition: form-data; name="{k}"; filename="{fn}"\r\nContent-Type: application/octet-stream\r\n\r\n').encode() + content + b'\r\n'
                  body += (f'--{b}--\r\n').encode()
                  req = urllib.request.Request(url, data=body, headers={'Content-Type': f'multipart/form-data; boundary={b}'})
              else:
                  req = urllib.request.Request(url, data=urllib.parse.urlencode(fields).encode())
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          res = post('sendMessage', {'chat_id': chat, 'text': text, 'parse_mode': 'HTML', 'disable_web_page_preview': 'true'})
          if not res.get('ok'):
              print('sendMessage failed:', res); sys.exit(1)
          mid = res['result']['message_id']
          print('announcement message_id:', mid)
          for path in sorted(glob.glob('dist/*.deb')):
              r = post('sendDocument', {'chat_id': chat, 'reply_to_message_id': str(mid)},
                       {'document': (os.path.basename(path), open(path, 'rb').read())})
              if not r.get('ok'):
                  print('sendDocument failed:', path, r); sys.exit(1)
              print('document sent:', os.path.basename(path))
          PY
